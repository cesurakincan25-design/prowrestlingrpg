name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Siteyi hazırla + Gemini key'i yerleştir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_PWRPG }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -n "$GEMINI_API_KEY" ]; then
            python3 -c "import os;p='_site/index.html';s=open(p,encoding='utf-8').read();assert '__GEMINI_KEY__' in s;open(p,'w',encoding='utf-8').write(s.replace('__GEMINI_KEY__',os.environ['GEMINI_API_KEY']))"
            echo "Gemini key yerleştirildi."
          else
            echo "::warning::GEMINI_API_KEY secret tanımlı değil — AI offline şablonla çalışacak."
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
